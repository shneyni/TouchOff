apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.touchlocker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.touchlocker.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // Intentionally no AndroidX / support libraries — pure platform SDK only,
    // keeps the APK tiny and RAM footprint minimal.
}
