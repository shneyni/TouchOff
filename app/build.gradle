apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.touchlocker.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.touchlocker.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // One fixed keystore used for EVERY build (debug and release, local and
    // CI). Without this, each environment signs with its own auto-generated
    // debug key, so every new build looks like a "different app" to Android
    // and blocks in-place updates, forcing uninstall + reinstall every time.
    signingConfigs {
        release {
            storeFile file("keystore/touchoff.jks")
            storePassword "touchoff123"
            keyAlias "touchoff"
            keyPassword "touchoff123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // Intentionally no AndroidX / support libraries — pure platform SDK only,
    // keeps the APK tiny and RAM footprint minimal.
}
